<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parroquias CABA</title>
<meta name="description" content="Guía de parroquias y templos católicos de la Ciudad de Buenos Aires: horarios de misas y confesiones.">
<meta name="theme-color" content="#243B8F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parroquias">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23243B8F'/%3E%3Cpath d='M44 18h12v22h22v12H56v30H44V52H22V40h22z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23243B8F'/%3E%3Cpath d='M44 18h12v22h22v12H56v30H44V52H22V40h22z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="manifest" id="manifest-link">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ============ Tokens ============ */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#14181F; --muted:#586070; --line:#E1E5EB;
  --brand:#243B8F; --brand-soft:#E8ECF9; --gold:#8F6417; --gold-soft:#F6EEDD;
  --r-lg:20px; --r-md:14px; --r-pill:999px;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --ease:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;
  padding-top:env(safe-area-inset-top,0px);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

/* ============ Layout ============ */
.app{max-width:640px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom,0px))}
header{padding:28px 4px 14px}
h1{font-family:var(--serif);font-weight:600;font-size:2rem;letter-spacing:-.02em;line-height:1.1}
.sub{color:var(--muted);margin-top:4px;font-size:.95rem}

/* ============ Buscador ============ */
.search{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 82%,transparent);padding:8px 0 10px}
.field{position:relative}
.field svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
#q{width:100%;height:50px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);
  padding:0 16px 0 44px;font:inherit;font-size:1rem;color:var(--ink)}
#q:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.suggest{position:absolute;left:0;right:0;top:56px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-md);box-shadow:0 12px 32px rgba(20,24,31,.12);overflow:hidden;display:none}
.suggest.open{display:block}
.suggest button{display:flex;justify-content:space-between;gap:12px;width:100%;padding:13px 16px;text-align:left}
.suggest button+button{border-top:1px solid var(--line)}
.suggest button:hover,.suggest button:focus-visible{background:var(--brand-soft)}
.suggest small{color:var(--muted)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 16px;border-radius:var(--r-pill);border:1px solid var(--line);
  background:var(--surface);font-size:.9rem;font-weight:500;transition:background .15s,color .15s}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.fav[aria-pressed="true"]{background:var(--gold);border-color:var(--gold)}

/* ============ Tarjetas ============ */
.count{color:var(--muted);font-size:.85rem;padding:14px 4px 8px}
.list{display:grid;gap:12px}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:18px;position:relative;transition:transform .15s}
.card:active{transform:scale(.985)}
.card h2{font-family:var(--serif);font-size:1.3rem;font-weight:600;line-height:1.2;padding-right:44px;letter-spacing:-.01em}
.card .addr{color:var(--muted);font-size:.9rem;margin-top:4px}
.card .next{margin-top:14px;font-size:.9rem;font-weight:500;color:var(--brand)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{font-size:.78rem;padding:3px 10px;border-radius:var(--r-pill);background:var(--brand-soft);color:var(--brand);font-weight:500}
.heart{position:absolute;top:10px;right:10px;width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.heart svg{width:24px;height:24px;fill:none;stroke:var(--muted);stroke-width:1.8;transition:transform .2s}
.heart[aria-pressed="true"] svg{fill:var(--gold);stroke:var(--gold);transform:scale(1.1)}
.empty{text-align:center;color:var(--muted);padding:48px 16px}
.empty strong{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}

/* ============ Vista de detalle (hoja deslizante) ============ */
.scrim{position:fixed;inset:0;background:rgba(20,24,31,.45);opacity:0;pointer-events:none;transition:opacity .3s;z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;height:92%;background:var(--bg);
  border-radius:24px 24px 0 0;z-index:11;transform:translateY(100%);transition:transform .38s var(--ease);
  display:flex;flex-direction:column;visibility:hidden}
body.open .scrim{opacity:1;pointer-events:auto}
body.open .sheet{transform:none;visibility:visible}
.sheet-top{display:flex;justify-content:space-between;align-items:center;padding:14px 12px 4px 20px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);position:absolute;top:8px;left:50%;margin-left:-20px}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}
.icon-btn.heart-on svg{fill:var(--gold);stroke:var(--gold)}
.sheet-body{overflow-y:auto;padding:4px 20px calc(120px + env(safe-area-inset-bottom,0px));flex:1}
.sheet h2{font-family:var(--serif);font-size:1.75rem;line-height:1.15;font-weight:600;letter-spacing:-.015em}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;margin-top:14px}
.block h3{font-size:.95rem;font-weight:600;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:16px;padding:8px 0}
.row+.row{border-top:1px solid var(--line)}
.row .d{color:var(--muted)}
.row .h{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:.9rem;margin-top:8px}
.actions{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(transparent,var(--bg) 35%)}
.btn{flex:1;height:52px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;gap:8px;
  font-weight:600;text-decoration:none;border:1px solid var(--brand)}
.btn.primary{background:var(--brand);color:#fff}
.btn.ghost{background:var(--surface);color:var(--brand)}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:var(--r-pill);font-size:.9rem;opacity:0;
  transition:.25s;z-index:20;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>Parroquias de Buenos Aires</h1>
    <p class="sub">Encontrá misas y confesiones cerca tuyo.</p>
  </header>

  <div class="search">
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscá por nombre, barrio o calle" autocomplete="off" aria-label="Buscar parroquias" aria-controls="suggest">
      <div class="suggest" id="suggest" role="listbox"></div>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filtros"></div>
  </div>

  <p class="count" id="count" aria-live="polite"></p>
  <main class="list" id="list"></main>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="d-name" aria-hidden="true">
  <span class="grab"></span>
  <div class="sheet-top">
    <button class="icon-btn" id="d-close" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <button class="icon-btn" id="d-fav" aria-label="Agregar a favoritos"><svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg></button>
  </div>
  <div class="sheet-body" id="d-body"></div>
  <div class="actions">
    <a class="btn ghost" id="d-call">Llamar</a>
    <a class="btn primary" id="d-map" target="_blank" rel="noopener">Cómo llegar</a>
  </div>
</section>
<div class="toast" id="toast" role="status"></div>

<script>
/* =====================================================================
   DATOS (mock). Direcciones reales de CABA. Horarios y teléfonos son
   ILUSTRATIVOS: verificar con cada parroquia antes de publicar.
   d = días (0 domingo … 6 sábado), h = horarios "HH:MM"
   ===================================================================== */
const WK = [1,2,3,4,5];
const PARISHES = [
  { id:"catedral", nombre:"Catedral Metropolitana", barrio:"San Nicolás", direccion:"Rivadavia 437",
    tel:"+54 11 5555-0101", tags:["Histórico","Plaza de Mayo"],
    misas:[{d:WK,h:["08:00","12:30","18:00"]},{d:[6],h:["10:00","18:00"]},{d:[0],h:["09:00","11:00","12:30","18:00"]}],
    confesiones:[{d:WK,h:["10:00","17:00"]},{d:[6],h:["10:00"]}],
    nota:"Sede del Arzobispado de Buenos Aires. Confirmar horarios en fechas especiales." },
  { id:"pilar", nombre:"Basílica Nuestra Señora del Pilar", barrio:"Recoleta", direccion:"Junín 1904",
    tel:"+54 11 5555-0102", tags:["Histórico","Recoleta"],
    misas:[{d:WK,h:["09:00","19:00"]},{d:[6],h:["19:00"]},{d:[0],h:["10:00","12:00","19:00"]}],
    confesiones:[{d:WK,h:["18:00"]},{d:[6],h:["18:00"]}],
    nota:"Templo colonial junto al Cementerio de la Recoleta." },
  { id:"santisimo", nombre:"Basílica del Santísimo Sacramento", barrio:"Retiro", direccion:"San Martín 1039",
    tel:"+54 11 5555-0103", tags:["Adoración","Retiro"],
    misas:[{d:WK,h:["08:00","12:00","19:00"]},{d:[6],h:["19:00"]},{d:[0],h:["10:00","12:00","19:00"]}],
    confesiones:[{d:WK,h:["11:00","18:00"]}],
    nota:"Con adoración eucarística durante la semana." },
  { id:"flores", nombre:"Basílica San José de Flores", barrio:"Flores", direccion:"Av. Rivadavia 6950",
    tel:"+54 11 5555-0104", tags:["Histórico","Flores"],
    misas:[{d:WK,h:["08:00","12:00","19:30"]},{d:[6],h:["19:30"]},{d:[0],h:["09:00","11:00","19:30"]}],
    confesiones:[{d:WK,h:["17:30"]},{d:[6],h:["17:30"]}],
    nota:"Templo donde Jorge Bergoglio sintió su vocación sacerdotal." }
];
const DAYS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const WEEK_LABEL = (d)=> d.length===5?"Lunes a viernes": d.length===1?DAYS[d[0]][0].toUpperCase()+DAYS[d[0]].slice(1)+"s": d.map(i=>DAYS[i]).join(", ");

/* =====================================================================
   Utilidades
   ===================================================================== */
const $ = (s)=>document.querySelector(s);
const norm = (s)=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();

// localStorage seguro: si el navegador lo bloquea, usa memoria.
const Store = (()=>{
  const mem = {};
  return {
    get(k,def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return mem[k]??def; } },
    set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ mem[k]=v; } }
  };
})();

/* =====================================================================
   Estado
   ===================================================================== */
const state = { q:"", barrio:null, soloFav:false, favs:new Set(Store.get("favs",[])), current:null };

/* Próxima misa de hoy, para mostrar en la tarjeta */
function nextMass(p){
  const now = new Date(), today = now.getDay(), cur = now.getHours()*60+now.getMinutes();
  const hs = p.misas.filter(m=>m.d.includes(today)).flatMap(m=>m.h)
    .filter(h=>{const [a,b]=h.split(":");return +a*60+ +b>=cur}).sort();
  return hs.length ? `Próxima misa hoy: ${hs[0]} h` : "Hoy no hay más misas";
}

/* =====================================================================
   Render: chips, lista, sugerencias
   ===================================================================== */
const ICON_HEART = '<svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg>';

function renderChips(){
  const barrios = [...new Set(PARISHES.map(p=>p.barrio))].sort();
  $("#chips").innerHTML =
    `<button class="chip fav" data-fav aria-pressed="${state.soloFav}">Favoritos</button>` +
    barrios.map(b=>`<button class="chip" data-barrio="${b}" aria-pressed="${state.barrio===b}">${b}</button>`).join("");
}

function filtered(){
  const q = norm(state.q.trim());
  return PARISHES.filter(p=>{
    if(state.soloFav && !state.favs.has(p.id)) return false;
    if(state.barrio && p.barrio!==state.barrio) return false;
    return !q || norm([p.nombre,p.barrio,p.direccion,...p.tags].join(" ")).includes(q);
  });
}

function renderList(){
  const items = filtered();
  $("#count").textContent = items.length ? `${items.length} ${items.length===1?"resultado":"resultados"}` : "";
  $("#list").innerHTML = items.length ? items.map(p=>`
    <div class="card-wrap" style="position:relative">
      <button class="card" data-id="${p.id}">
        <h2>${p.nombre}</h2>
        <p class="addr">${p.direccion}, ${p.barrio}</p>
        <p class="next">${nextMass(p)}</p>
        <div class="tags">${p.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
      </button>
      <button class="heart" data-heart="${p.id}" aria-pressed="${state.favs.has(p.id)}"
        aria-label="Favorito: ${p.nombre}">${ICON_HEART}</button>
    </div>`).join("")
  : `<div class="empty"><strong>No encontramos parroquias</strong>Probá con otro nombre o quitá algún filtro.</div>`;
}

function renderSuggest(){
  const box = $("#suggest"), q = norm(state.q.trim());
  if(!q){ box.classList.remove("open"); return; }
  const hits = PARISHES.filter(p=>norm(p.nombre+" "+p.barrio+" "+p.direccion).includes(q)).slice(0,4);
  box.innerHTML = hits.map(p=>`<button role="option" data-sug="${p.nombre}"><span>${p.nombre}</span><small>${p.barrio}</small></button>`).join("");
  box.classList.toggle("open", hits.length>0);
}

/* =====================================================================
   Favoritos
   ===================================================================== */
function toggleFav(id){
  state.favs.has(id) ? state.favs.delete(id) : state.favs.add(id);
  Store.set("favs",[...state.favs]);
  toast(state.favs.has(id) ? "Agregado a favoritos" : "Quitado de favoritos");
  renderList(); syncDetailFav();
}
function syncDetailFav(){
  if(!state.current) return;
  const on = state.favs.has(state.current.id), b = $("#d-fav");
  b.classList.toggle("heart-on", on);
  b.setAttribute("aria-label", on?"Quitar de favoritos":"Agregar a favoritos");
}

/* =====================================================================
   Vista de detalle
   ===================================================================== */
const scheduleBlock = (title, list)=> `
  <div class="block"><h3>${title}</h3>
  ${list.map(s=>`<div class="row"><span class="d">${WEEK_LABEL(s.d)}</span><span class="h">${s.h.join(" · ")}</span></div>`).join("")}</div>`;

function openDetail(id){
  const p = PARISHES.find(x=>x.id===id); state.current = p;
  $("#d-body").innerHTML = `
    <h2 id="d-name">${p.nombre}</h2>
    <p class="sub">${p.direccion}, ${p.barrio}, CABA</p>
    <div class="tags">${p.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
    ${scheduleBlock("Misas",p.misas)}
    ${scheduleBlock("Confesiones",p.confesiones)}
    <div class="block"><h3>Contacto</h3>
      <div class="row"><span class="d">Teléfono</span><span class="h">${p.tel||"No disponible"}</span></div>
      <div class="row"><span class="d">Dirección</span><span class="h">${p.direccion}</span></div>
      ${p.nota?`<p class="note">${p.nota}</p>`:""}</div>`;
  const call = $("#d-call");
  p.tel ? (call.href="tel:"+p.tel.replace(/[^+\d]/g,""), call.removeAttribute("aria-disabled"))
        : (call.removeAttribute("href"), call.setAttribute("aria-disabled","true"));
  $("#d-map").href = "https://www.google.com/maps/dir/?api=1&destination="+
    encodeURIComponent(`${p.nombre}, ${p.direccion}, Ciudad Autónoma de Buenos Aires`);
  $("#d-body").scrollTop = 0;
  syncDetailFav();
  document.body.classList.add("open");
  $("#sheet").setAttribute("aria-hidden","false");
  $("#d-close").focus();
}
function closeDetail(){
  document.body.classList.remove("open");
  $("#sheet").setAttribute("aria-hidden","true");
  state.current = null;
}

let toastTimer;
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),1600);
}

/* =====================================================================
   Eventos
   ===================================================================== */
$("#q").addEventListener("input", e=>{ state.q=e.target.value; renderSuggest(); renderList(); });
$("#q").addEventListener("focus", renderSuggest);
$("#suggest").addEventListener("click", e=>{
  const b=e.target.closest("[data-sug]"); if(!b) return;
  state.q=b.dataset.sug; $("#q").value=state.q; $("#suggest").classList.remove("open"); renderList();
});
document.addEventListener("click", e=>{ if(!e.target.closest(".field")) $("#suggest").classList.remove("open"); });

$("#chips").addEventListener("click", e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  if("fav" in b.dataset) state.soloFav=!state.soloFav;
  else state.barrio = state.barrio===b.dataset.barrio ? null : b.dataset.barrio;
  renderChips(); renderList();
});
$("#list").addEventListener("click", e=>{
  const h=e.target.closest("[data-heart]"); if(h) return toggleFav(h.dataset.heart);
  const c=e.target.closest("[data-id]"); if(c) openDetail(c.dataset.id);
});
$("#d-fav").addEventListener("click", ()=> state.current && toggleFav(state.current.id));
$("#d-close").addEventListener("click", closeDetail);
$("#scrim").addEventListener("click", closeDetail);
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeDetail(); });

/* =====================================================================
   PWA: manifest generado en línea (para un archivo único).
   Para producción, mové el manifest a manifest.json y registrá un
   service worker (sw.js) para modo offline.
   ===================================================================== */
(function(){
  const icon = "data:image/svg+xml;utf8,"+encodeURIComponent(
    "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='#243B8F'/><path d='M44 18h12v22h22v12H56v30H44V52H22V40h22z' fill='#fff'/></svg>");
  const manifest = { name:"Parroquias de Buenos Aires", short_name:"Parroquias", lang:"es-AR",
    start_url:".", display:"standalone", background_color:"#F2F4F7", theme_color:"#243B8F",
    icons:[{src:icon,sizes:"any",type:"image/svg+xml",purpose:"any maskable"}] };
  try{ $("#manifest-link").href = URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"})); }catch(e){}
})();

/* Inicio */
renderChips(); renderList();
</script>
</body>
</html>
