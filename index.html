<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía Parroquial | Recoleta y Alrededores</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sacred: {
                            50: '#f8f6f4',
                            800: '#1e293b',
                            900: '#0f172a',
                            accent: '#334155'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Ocultamiento seguro del módulo de comunidad para reactivar en el futuro */
        .community-module {
            display: none !important;
        }
    </style>
</head>
<body class="bg-sacred-50 text-slate-800 antialiased pb-24">

    <!-- Header / Buscador -->
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200 px-4 py-3 shadow-sm">
        <div class="max-w-md mx-auto flex items-center justify-between gap-3">
            <h1 class="text-base font-semibold tracking-tight text-slate-900">Guía Parroquial</h1>
            <div class="relative flex-1 max-w-[200px]">
                <input type="text" id="searchInput" placeholder="Buscar parroquia..." 
                    class="w-full bg-slate-100 text-xs rounded-full py-1.5 px-3 focus:outline-none focus:ring-2 focus:ring-slate-400">
            </div>
        </div>
    </header>

    <!-- Main Container (Dinámico) -->
    <main class="max-w-md mx-auto p-4 space-y-4" id="mainContainer">
        <!-- Las tarjetas se inyectan aquí mediante JavaScript -->
    </main>

    <!-- Vista de Comunidad (Oculta pero preservada en código) -->
    <section id="communityView" class="community-module max-w-md mx-auto p-4">
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 text-center">
            <h2 class="text-lg font-semibold mb-2">Comunidad Parroquial</h2>
            <p class="text-sm text-slate-500">Espacio reservado para avisos, intenciones y participación comunitaria.</p>
        </div>
    </section>

    <!-- Bottom Navigation (Mobile Native Feel) -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-slate-200 px-4 py-2">
        <div class="max-w-md mx-auto flex justify-around items-center text-slate-600">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center p-1 text-slate-900">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                <span class="text-[10px] mt-0.5 font-medium">Inicio</span>
            </button>
            <button onclick="switchTab('horarios')" id="nav-horarios" class="flex flex-col items-center p-1 text-slate-500">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span class="text-[10px] mt-0.5 font-medium">Horarios</span>
            </button>
            <!-- BOTÓN DE COMUNIDAD OCULTO EN LA UI -->
            <button onclick="switchTab('community')" id="nav-community" class="community-module flex flex-col items-center p-1 text-slate-500">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                <span class="text-[10px] mt-0.5 font-medium">Comunidad</span>
            </button>
            <button onclick="switchTab('favorites')" id="nav-favorites" class="flex flex-col items-center p-1 text-slate-500">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
                <span class="text-[10px] mt-0.5 font-medium">Favoritos</span>
            </button>
        </div>
    </nav>

    <!-- Lógica y Base de Datos Integrada -->
    <script>
        // Base de datos integrada de Parroquias
        const parroquiasData = [
            {
                id: "pilar",
                nombre: "Parroquia Nuestra Señora del Pilar",
                direccion: "Junín 1904",
                barrio: "Recoleta",
                horariosMisa: ["Domingos: 10:00, 12:00 y 19:00 hs", "Lunes a Sábados: 18:30 hs"],
                horariosConfesion: ["Martes y Jueves: 17:00 a 18:00 hs"],
                imagen: "https://images.unsplash.com/photo-1548625361-16b23e85f474?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: "socorro",
                nombre: "Parroquia Nuestra Señora del Socorro",
                direccion: "Juncal 876",
                barrio: "Retiro / Recoleta",
                horariosMisa: ["Domingos: 11:00 y 20:00 hs", "Martes a Sábados: 19:00 hs"],
                horariosConfesion: ["Sábados antes de misa de 19:00 hs"],
                imagen: "https://images.unsplash.com/photo-1519817650390-64a93db51149?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: "rotunda",
                nombre: "Basílica Santísimo Sacramento",
                direccion: "San Martín 1039",
                barrio: "Retiro",
                horariosMisa: ["Domingos: 09:30, 11:00 y 18:00 hs", "Lunes a Viernes: 12:30 y 17:30 hs"],
                horariosConfesion: ["Lunes a Viernes de 16:00 a 17:00 hs"],
                imagen: "https://images.unsplash.com/photo-1543807535-eceef0bc6599?auto=format&fit=crop&w=600&q=80"
            }
        ];

        let currentTab = 'home';
        let searchQuery = '';

        function getFavorites() {
            try {
                return JSON.parse(localStorage.getItem('parroquia_favs')) || [];
            } catch(e) {
                return [];
            }
        }

        function toggleFavorite(id) {
            let favs = getFavorites();
            if (favs.includes(id)) {
                favs = favs.filter(favId => favId !== id);
            } else {
                favs.push(id);
            }
            localStorage.setItem('parroquia_favs', JSON.stringify(favs));
            renderApp();
        }

        function switchTab(tab) {
            currentTab = tab;
            // Actualizar estilos de la barra de navegación inferior
            ['home', 'horarios', 'community', 'favorites'].forEach(t => {
                const el = document.getElementById(`nav-${t}`);
                if (el) {
                    if (t === tab) {
                        el.classList.remove('text-slate-500');
                        el.classList.add('text-slate-900');
                    } else {
                        el.classList.remove('text-slate-900');
                        el.classList.add('text-slate-500');
                    }
                }
            });

            const communityView = document.getElementById('communityView');
            const mainContainer = document.getElementById('mainContainer');

            if (tab === 'community') {
                if(communityView) communityView.style.display = 'block';
                if(mainContainer) mainContainer.style.display = 'none';
            } else {
                if(communityView) communityView.style.display = 'none';
                if(mainContainer) mainContainer.style.display = 'block';
                renderApp();
            }
        }

        function renderApp() {
            const container = document.getElementById('mainContainer');
            if (!container) return;

            let dataToDisplay = [...parroquiasData];
            const favs = getFavorites();

            // Filtrado por pestaña
            if (currentTab === 'favorites') {
                dataToDisplay = dataToDisplay.filter(p => favs.includes(p.id));
            }

            // Filtrado por buscador
            if (searchQuery.trim() !== '') {
                const query = searchQuery.toLowerCase();
                dataToDisplay = dataToDisplay.filter(p => 
                    p.nombre.toLowerCase().includes(query) || 
                    p.barrio.toLowerCase().includes(query) ||
                    p.direccion.toLowerCase().includes(query)
                );
            }

            if (dataToDisplay.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 bg-white rounded-2xl p-6 border border-slate-100 shadow-sm">
                        <p class="text-slate-500 text-sm">No se encontraron parroquias.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = dataToDisplay.map(p => {
                const isFav = favs.includes(p.id);
                return `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden transition-all">
                        <div class="h-36 w-full relative">
                            <img src="${p.imagen}" alt="${p.nombre}" class="w-full h-full object-cover">
                            <button onclick="toggleFavorite('${p.id}')" class="absolute top-3 right-3 bg-white/90 backdrop-blur-sm p-2 rounded-full shadow-md text-slate-700 hover:text-red-500 transition-colors">
                                <svg class="w-5 h-5 ${isFav ? 'text-red-500 fill-current' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                                </svg>
                            </button>
                            <span class="absolute bottom-3 left-3 bg-slate-900/70 backdrop-blur-sm text-white text-[10px] font-medium px-2.5 py-1 rounded-full">
                                ${p.barrio}
                            </span>
                        </div>
                        <div class="p-4 space-y-3">
                            <div>
                                <h3 class="font-semibold text-slate-900 text-base leading-snug">${p.nombre}</h3>
                                <p class="text-xs text-slate-500 mt-0.5">${p.direccion}</p>
                            </div>
                            
                            <div class="border-t border-slate-100 pt-3 space-y-2 text-xs">
                                <div>
                                    <span class="font-semibold text-slate-700 block mb-0.5">⛪ Horarios de Misa:</span>
                                    <ul class="text-slate-600 space-y-0.5">
                                        ${p.horariosMisa.map(h => `<li>• ${h}</li>`).join('')}
                                    </ul>
                                </div>
                                <div>
                                    <span class="font-semibold text-slate-700 block mb-0.5">🕊️ Confesiones:</span>
                                    <ul class="text-slate-600 space-y-0.5">
                                        ${p.horariosConfesion.map(c => `<li>• ${c}</li>`).join('')}
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Event listener para el buscador en tiempo real
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderApp();
        });

        // Inicializar app al cargar
        document.addEventListener('DOMContentLoaded', () => {
            renderApp();
        });
    </script>
</body>
</html>
